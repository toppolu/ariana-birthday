<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>🦄 Ariana's Birthday Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260222-fixed" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="brand__title">🦄 Ariana's Birthday Calendar 🌈</div>
        <div class="brand__subtitle" id="subtitle">Next door opens at midnight PT</div>
      </div>
      <div class="pill" id="progressPill">✨ 0/17</div>
    </header>

    <main class="main">
      <section class="card card--home" id="home">
        <div class="home__meta">
          <div class="home__date" id="todayLabel">Today:</div>
          <button class="iconBtn" id="soundBtn" aria-label="Toggle sound">
            <span id="soundIcon">🔊</span>
          </button>
        </div>

        <div class="grid" id="doorGrid" aria-label="Birthday door grid"></div>

        <div class="home__footer">
          <button class="btn btn--secondary" id="vaultBtn">🌟 Treasure Vault</button>
          <button class="btn btn--ghost" id="resetBtn">Reset</button>
        </div>
      </section>

      <section class="card card--stage hidden" id="stage">
        <div class="stage__top">
          <button class="btn btn--ghost" id="backBtn">← Back</button>
          <div class="stage__title" id="stageTitle">Day</div>
        </div>

        <div id="bdCountdown" class="bd-countdown-strip"></div>
        <div class="stage__body" id="stageBody"></div>

        <div class="stage__bottom">
          <div class="hint" id="hintText">✨ Take your time — you've got this!</div>
          <div class="stage__actions">
            <button class="btn btn--secondary" id="restartBtn">↺ Try Again</button>
            <button class="btn btn--primary" id="claimBtn" disabled>✨ Claim Magic!</button>
          </div>
        </div>
      </section>

      <section class="card card--vault hidden" id="vault">
        <div class="vault__top">
          <button class="btn btn--ghost" id="vaultBackBtn">← Back</button>
          <div class="stage__title">🌟 Treasure Vault</div>
        </div>
        <div class="vault__grid" id="vaultGrid"></div>
        <div class="vault__note">💜 Tap a crystal to read its message.</div>
      </section>
    </main>

    <!-- Modal -->
    <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
      <div class="modal__sheet">
        <div class="modal__title" id="modalTitle">✨ Unlocked!</div>
        <div class="modal__body" id="modalBody"></div>
        <div class="modal__actions" id="modalActions">
          <button class="btn btn--primary" id="modalOkBtn">Yay! 🎉</button>
        </div>
      </div>
      <div class="modal__backdrop" id="modalBackdrop"></div>
    </div>
  </div>

  <script src="./app.js?v=20260222-fixed"></script>
</body>
</html>
